version: '3.8'

services:
  llmops-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llmops-studio-app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://llmops_user:llmops_secret@postgres:5432/llmops_db
      - OLLAMA_BASE_URL=http://ollama:11434
      - LOG_LEVEL=INFO
    volumes:
      - studio-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: llmops-studio-postgres
    environment:
      - POSTGRES_USER=llmops_user
      - POSTGRES_PASSWORD=llmops_secret
      - POSTGRES_DB=llmops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmops_user -d llmops_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: llmops-studio-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    profiles:
      - full
    restart: unless-stopped

volumes:
  pgdata:
  ollama-models:
  studio-data:

